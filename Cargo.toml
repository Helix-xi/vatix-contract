[workspace]
resolver = "2"
members = [
  "contracts/*",
]

[workspace.dependencies]
soroban-sdk = "23"
# Soroban 23.0.x is built against the legacy 'rand 0.8 / rand_chacha 0.3 / ed25519-dalek 2.2'
# stack. Pinning these versions at the workspace level keeps the host test utilities and our
# test-only signing code on the same compatible RNG trait set.
ed25519-dalek = "=2.2.0"
curve25519-dalek = "=4.1.3"
rand = "=0.8.5"
rand_chacha = "=0.3.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
